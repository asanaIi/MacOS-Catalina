<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
	<meta name="google-site-verification" content="y7QimmZ7LXjWkTkyctyoAMTsAM_3g3FHGQVMIcNBYGU" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>macOS Catalina in vercel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="h-screen w-screen overflow-hidden select-none font-sans text-white text-sm bg-cover bg-center">

    <header class="w-full h-6 fixed top-0 left-0 mac-glass flex items-center justify-between px-4 text-xs font-medium z-[9999] shadow-sm">
        <div class="flex items-center space-x-4">
            <button onclick="System.toggleLaunchpad()" class="hover:bg-white/20 px-2 py-0.5 rounded transition" id="apple-logo-btn">
                <svg class="w-3 h-3 fill-current" viewBox="0 0 170 170">
                    <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.37.13-9.13-1.9-14.31-6.08-3.34-2.58-7.33-7.53-11.97-14.85-5.52-8.7-9.92-18.11-13.2-28.23-3.28-10.11-4.92-19.81-4.92-29.09 0-12.35 3.06-22.38 9.18-30.08 6.12-7.7 13.73-11.59 22.84-11.69 4.58 0 9.49 1.22 14.75 3.65 5.25 2.43 8.94 3.65 11.07 3.65 2.02 0 6.05-1.32 12.08-3.95 6.04-2.63 10.9-3.9 15.59-3.81 13.57.22 24.11 5.16 31.62 14.81-11.98 7.35-17.84 16.99-17.58 28.94.26 9.75 4.02 17.84 11.28 24.28 7.27 6.45 15.67 9.87 25.21 10.28-2.14 6.24-4.8 12.34-7.98 18.29zm-23.73-104.91c0 7.82-2.9 14.94-8.71 21.36-5.81 6.41-12.83 10.15-21.07 11.21.09-1.21.13-2.33.13-3.34 0-7.55 2.87-14.49 8.6-20.82 5.73-6.33 13.15-10.12 22.24-11.37.26 2.21.39 4.54.39 6.96z"/>
                </svg>
            </button>
            <button class="font-bold hover:bg-white/20 px-2 py-0.5 rounded transition" id="active-app-title">Finder</button>
            <button class="hover:bg-white/20 px-2 py-0.5 rounded transition hidden sm:block">Файл</button>
            <button class="hover:bg-white/20 px-2 py-0.5 rounded transition hidden sm:block">Правка</button>
            <button class="hover:bg-white/20 px-2 py-0.5 rounded transition" onclick="System.triggerKernelPanic()">Лучше не нажимать сюда</button>
        </div>
        <div class="flex items-center space-x-3">
            <span id="battery" class="opacity-90">🔋 ∞%</span>
            <span id="clock" class="hover:bg-white/20 px-2 py-0.5 rounded transition font-medium"></span>
        </div>
    </header>

    <div id="launchpad" class="fixed inset-0 z-[9990] bg-black/60 backdrop-blur-3xl hidden flex-col items-center justify-center p-20 transition-all duration-300 opacity-0">
        <div class="grid grid-cols-4 sm:grid-cols-5 md:grid-cols-6 gap-12 max-w-4xl text-center">
            <div class="lp-icon" onclick="WindowManager.open('terminal')"><span class="text-4xl block mb-2">💻</span>Terminal</div>
            <div class="lp-icon" onclick="WindowManager.open('console')"><span class="text-4xl block mb-2">🛠️</span>Console</div>
            <div class="lp-icon" onclick="WindowManager.open('safari')"><span class="text-4xl block mb-2">🧭</span>Safari</div>
            <div class="lp-icon" onclick="WindowManager.open('calendar')"><span class="text-4xl block mb-2">📅</span>Calendar</div>
            <div class="lp-icon" onclick="WindowManager.open('photos')"><span class="text-4xl block mb-2">🖼️</span>Photos</div>
            <div class="lp-icon" onclick="WindowManager.open('quicktime')"><span class="text-4xl block mb-2">🎬</span>QuickTime</div>
            <div class="lp-icon" onclick="WindowManager.open('music')"><span class="text-4xl block mb-2">🎵</span>Music</div>
            <div class="lp-icon" onclick="WindowManager.open('tv')"><span class="text-4xl block mb-2">🍿</span>Kinogo TV</div>
            <div class="lp-icon" onclick="WindowManager.open('notes')"><span class="text-4xl block mb-2">📝</span>Notes</div>
            <div class="lp-icon" onclick="WindowManager.open('notepad')"><span class="text-4xl block mb-2">🗒️</span>Notepad++</div>
        </div>
    </div>

    <div id="desktop" class="w-full h-full pt-6 pb-24 relative overflow-hidden">
        
        </div>

    <div id="kernel-panic" class="fixed inset-0 bg-zinc-950 text-white font-mono p-12 z-[99999] hidden flex-col justify-center">
        <h1 class="text-2xl text-red-500 mb-4">⚠️ System is corrupted.</h1>
        <p class="text-zinc-400 mb-2">Reason: CRITICAL_KERNEL_PANIC</p>
        <p class="text-zinc-500 mb-6">Зависимости NW.js повреждены виртуальным вызовом.</p>
        <button onclick="location.reload()" class="w-44 bg-white text-black p-2 rounded text-center font-bold font-sans text-xs">Перезагрузить систему</button>
    </div>

    <div class="fixed bottom-3 left-1/2 -translate-x-1/2 mac-glass h-16 px-4 rounded-2xl flex items-end pb-1.5 space-x-3.5 shadow-2xl z-[999] transition-all">
        <div class="dock-item" onclick="System.toggleLaunchpad()"><span class="text-2xl">🚀</span></div>
        <div class="w-[1px] h-10 bg-white/20 self-center"></div>
        <div class="dock-item" id="dock-terminal" onclick="WindowManager.open('terminal')"><span class="text-2xl">💻</span><div class="dot"></div></div>
        <div class="dock-item" id="dock-console" onclick="WindowManager.open('console')"><span class="text-2xl">🛠️</span><div class="dot"></div></div>
        <div class="dock-item" id="dock-safari" onclick="WindowManager.open('safari')"><span class="text-2xl">🧭</span><div class="dot"></div></div>
        <div class="dock-item" id="dock-calendar" onclick="WindowManager.open('calendar')"><span class="text-2xl">📅</span><div class="dot"></div></div>
        <div class="dock-item" id="dock-photos" onclick="WindowManager.open('photos')"><span class="text-2xl">🖼️</span><div class="dot"></div></div>
        <div class="dock-item" id="dock-quicktime" onclick="WindowManager.open('quicktime')"><span class="text-2xl">🎬</span><div class="dot"></div></div>
        <div class="dock-item" id="dock-music" onclick="WindowManager.open('music')"><span class="text-2xl">🎵</span><div class="dot"></div></div>
        <div class="dock-item" id="dock-tv" onclick="WindowManager.open('tv')"><span class="text-2xl">🍿</span><div class="dot"></div></div>
        <div class="dock-item" id="dock-notes" onclick="WindowManager.open('notes')"><span class="text-2xl">📝</span><div class="dot"></div></div>
        <div class="dock-item" id="dock-notepad" onclick="WindowManager.open('notepad')"><span class="text-2xl">🗒️</span><div class="dot"></div></div>
    </div>

    <script src="apps.js"></script>
    <script src="system.js"></script>
</body>
</html>
